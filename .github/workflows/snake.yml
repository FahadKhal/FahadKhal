name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00FF50&color_dots=#161b22,#003d14,#00802a,#00c83f,#00FF50

      - name: Remove progress bar
        run: |
          sed -i -E 's#</style>#.u{display:none}</style>#; s/(viewBox="-16 -32 [0-9.]+ )192"/\1176"/; s/height="192"/height="176"/' dist/snake-dark.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
